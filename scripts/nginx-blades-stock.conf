# ==============================================================================
# Blades Stock — Nginx 高性能反向代理配置模板
# 适用场景：Ubuntu 24.04 VPS 部署在 http://127.0.0.1:8000
# 核心特性：
# 1. 延长超时至 600s，杜绝大模型长研报生成与复杂回测时的 502/504 截断
# 2. 关闭 proxy_buffering，确保 AI Agent SSE 流式打字机实时推流毫无卡顿
# 3. 开启 chunked_transfer_encoding 与 WebSocket 协议升级支持
# ==============================================================================

server {
    listen 80;
    server_name stock.8501025.xyz; # 替换为您的域名或公网 IP

    # 客户端上传文件大小限制（用于配置导入或数据恢复资产包）
    client_max_body_size 128M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 协议支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 核心：防 502/504 超时配置（大模型生成长研报需要 30~90 秒）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 核心：流式推流（SSE）零缓冲配置
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
