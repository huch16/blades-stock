# ==============================================================================
# Blades Stock — Nginx 高性能反向代理配置模板
# 适用场景：Ubuntu 24.04 VPS 部署在 http://127.0.0.1:8000
# 核心特性：
# 1. 延长超时至 600s，杜绝大模型长研报生成与复杂回测时的 502/504 截断
# 2. 关闭 proxy_buffering，确保 AI Agent SSE 流式打字机实时推流毫无卡顿
# 3. 开启 chunked_transfer_encoding 与 WebSocket 协议升级支持
#
# 安全注意（部署前必读）：
# - 本模板默认只监听 80 明文 HTTP：访问口令与 Cookie 均以明文传输，公网部署
#   请务必上 HTTPS（certbot + listen 443 ssl），并对 80 做 301 跳转到 https。
#   服务端注入的 HSTS 头只在 HTTPS 下才生效。
# - 登录接口无 Nginx 层限流时仅靠应用内“5 次失败锁 IP 15 分钟”兜底，建议按下
#   方注释示例启用 limit_req（登录 1 请求/秒、突发 5），并把后端 429 透传给客户端。
# - client_max_body_size 128M 偏宽松（导入/恢复资产包需要），若不需要导入功能
#   可收紧到 10M。
# ==============================================================================

# 限流示例（取消注释后生效）：
# limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name stock.8501025.xyz; # 替换为您的域名或公网 IP

    # 客户端上传文件大小限制（用于配置导入或数据恢复资产包）
    client_max_body_size 128M;

    # 登录接口限流（取消注释后生效，需配合顶部 limit_req_zone 定义）：
    # location = /api/auth/login {
    #     limit_req zone=login burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 协议支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 核心：防 502/504 超时配置（大模型生成长研报需要 30~90 秒）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 核心：流式推流（SSE）零缓冲配置
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
