name: 超跌反弹
alias:
  - rsi_reversal
  - 超跌
  - 短线反弹
category: reversal
judgment_criteria: 股价深度超跌（RSI 进入超卖区）后出现止跌信号，博弈超跌反弹。
description: 反转策略：仅在超卖且出现初步止跌信号时进场，止损严格，快进快出。
base_score: 50
bonuses:
  - when: "rsi_lt(30)"
    score: 30
    desc: "RSI 低于 30 进入超卖区"
  - when: "rsi_lt(20)"
    score: 15
    desc: "RSI 低于 20 深度超卖"
  - when: "change_pct_gt(0)"
    score: 10
    desc: "当日止跌翻红"
  - when: "above_ma(5)"
    score: 10
    desc: "收盘价站上 5 日均线"
  - when: "volume_ratio_gt(1.2)"
    score: 5
    desc: "量比放大，抄底资金进场"
penalties:
  - when: "change_pct_lt(-5)"
    score: 15
    desc: "当日继续大跌超过 5%"
  - when: "breakdown_low(20)"
    score: 20
    desc: "收盘价再创 20 日新低"
  - when: "macd_death_cross()"
    score: 10
    desc: "MACD 死叉，下跌动能未衰竭"
required_indicators:
  - rsi
  - ma5
risk_level: 高风险
hold_period: 1-5 个交易日
