name: MACD金叉
alias:
  - macd_golden_cross
  - macd金叉
  - 金叉反弹
category: momentum
judgment_criteria: DIF 上穿 DEA 形成 MACD 金叉，且价格位于关键均线上方，捕捉短期反弹动能。
description: 短线动能策略：MACD 金叉预示短期做多动能增强，结合均线与量能确认。
base_score: 50
bonuses:
  - when: "macd_golden_cross()"
    score: 30
    desc: "MACD 金叉"
  - when: "macd_above_zero()"
    score: 10
    desc: "MACD DIF 位于零轴上方"
  - when: "above_ma(20)"
    score: 10
    desc: "收盘价站上 20 日均线"
  - when: "volume_ratio_gt(1.5)"
    score: 10
    desc: "量比大于 1.5，放量确认"
  - when: "ma_golden_cross(5,10)"
    score: 10
    desc: "MA5 同时上穿 MA10"
penalties:
  - when: "macd_death_cross()"
    score: 25
    desc: "MACD 死叉"
  - when: "below_ma(60)"
    score: 20
    desc: "收盘价跌破 60 日均线"
  - when: "change_pct_lt(-5)"
    score: 15
    desc: "单日跌幅超过 5%"
required_indicators:
  - macd
  - ma20
  - ma60
risk_level: 中高风险
hold_period: 3-10 个交易日
