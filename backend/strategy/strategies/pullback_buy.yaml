name: 均线回踩
alias:
  - pullback_buy
  - 回踩低吸
  - 均线支撑
category: pullback
judgment_criteria: 上升趋势中价格回踩关键均线但不破位，缩量回踩确认支撑后低吸。
description: 回踩策略：趋势完好前提下，于均线支撑处低吸，回踩幅度与量能决定进场质量。
base_score: 50
bonuses:
  - when: "pullback_below_ma(20,3)"
    score: 25
    desc: "回踩 20 日均线且偏离不超过 3%"
  - when: "above_ma(60)"
    score: 10
    desc: "收盘价仍在 60 日均线上方，趋势未坏"
  - when: "volume_ratio_lt(1)"
    score: 10
    desc: "缩量回踩，抛压有限"
  - when: "ma_bullish_alignment()"
    score: 10
    desc: "均线仍为多头排列"
  - when: "rsi_gt(40)"
    score: 5
    desc: "RSI 大于 40，未进入弱势区"
penalties:
  - when: "breakdown_low(20)"
    score: 25
    desc: "收盘价跌破 20 日新低"
  - when: "below_ma(60)"
    score: 20
    desc: "收盘价跌破 60 日均线"
  - when: "change_pct_lt(-5)"
    score: 15
    desc: "单日跌幅超过 5%"
required_indicators:
  - ma20
  - ma60
  - rsi
risk_level: 中风险
hold_period: 3-10 个交易日
