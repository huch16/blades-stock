name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend build (required by go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Go mod tidy
        run: go mod tidy
      - name: Build (Go)
        run: go build -tags "desktop,production" ./...
      - name: Vet
        run: go vet -tags "desktop,production" ./...
      - name: Test
        run: go test -tags "desktop,production" -run "^Test" -skip "integration" ./...
