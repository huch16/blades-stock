name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend build (required by go:embed)
        working-directory: frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build
      - name: Go mod tidy
        run: go mod tidy
      - name: Build (Go)
        run: go build -tags "desktop,production" ./...
      - name: Vet
        run: go vet -tags "desktop,production" ./...
      - name: Test with coverage
        run: |
          go test -tags "desktop,production" -run "^Test" -skip "integration" -coverprofile=cover.out ./...
          # Show coverage per function
          go tool cover -func=cover.out
          # Calculate total coverage
          TOTAL=$(go tool cover -func=cover.out | grep ^total: | awk '{print $3}' | sed 's/%//')
          if (( $(echo "$TOTAL < 60.0" | bc -l) )); then
            echo "Coverage below 60%"
            exit 1
          fi

  smoke-backtest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run smoke backtest
        run: |
          go test -tags "desktop,production" -run TestRunAIReportBacktest ./backend/quant/...