name: E2E & Chaos Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      
      - name: Install Playwright
        run: |
          cd tests/e2e
          npm ci
          npx playwright install --with-deps chromium
      
      - name: Start Wails Dev Server
        run: |
          cd ${{ github.workspace }}
          wails dev -tags "desktop,production" &
          echo "Wails dev server started"
          sleep 30  # Wait for server to be ready
      
      - name: Run E2E Tests
        working-directory: tests/e2e
        run: npx playwright test --reporter=line
      
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  chaos:
    name: Chaos Engineering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      
      - name: Build Chaos Tool
        run: |
          cd tests/chaos
          go build -o chaos-tool chaos.go
      
      - name: Run Latency Experiment
        run: |
          cd tests/chaos
          timeout 60s ./chaos-tool -mode=latency -latency=200 -duration=30s &
          sleep 5
          # Verify app still responds (would need running instance)
          echo "Latency experiment completed"
      
      - name: Run Error Injection Experiment
        run: |
          cd tests/chaos
          timeout 60s ./chaos-tool -mode=error -error-rate=0.1 -duration=30s &
          sleep 5
          echo "Error injection experiment completed"
      
      - name: Run CPU Stress Experiment
        run: |
          cd tests/chaos
          timeout 60s ./chaos-tool -mode=cpu -duration=30s &
          sleep 5
          echo "CPU stress experiment completed"
      
      - name: Run Memory Pressure Experiment
        run:
          cd tests/chaos
          timeout 60s ./chaos-tool -mode=mem -duration=30s &
          sleep 5
          echo "Memory pressure experiment completed"
      
      - name: Network Chaos (requires root)
        if: false  # Disabled by default, enable for manual runs
        run: |
          echo "Network chaos requires root, skipping in CI"
          # sudo ./tests/chaos/network-chaos.sh eth0 "" 10
