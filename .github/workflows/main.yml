name: Wails build

on:
  push:
    tags:
      # Match any new tag
      - '*-release'
      - '*-dev'
      - '*-pre'

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"
  OFFICIAL_STATEMENT: ${{ vars.OFFICIAL_STATEMENT }}
  BUILD_KEY: ${{ vars.BUILD_KEY }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Failure in one platform build won't impact the others
      fail-fast: false
      matrix:
        build:
          - name: 'go-stock-windows-amd64.exe'
            platform:  'windows/amd64'
            os: 'windows-latest'
          - name: 'go-stock-windows-arm64.exe'
            platform:  'windows/arm64'
            os: 'windows-latest'
          - name: 'go-stock-darwin-universal'
            platform: 'darwin/universal'
            os: 'macos-latest'
          - name: 'go-stock-darwin-intel'
            platform: 'darwin/amd64'
            os: 'macos-latest'
          - name: 'go-stock-darwin-arm64'
            platform: 'darwin/arm64'
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get commit message
        id: get_commit_message
        run: |
          echo "commit_message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT

      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-release ]]; then
            echo "channel=release" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "channel_label=Release（稳定版）" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *-pre ]]; then
            echo "channel=pre" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel_label=Pre-release（预发布版）" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *-dev ]]; then
            echo "channel=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel_label=Dev（开发版）" >> $GITHUB_OUTPUT
          fi

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Generate bindings (required for -skipbindings)
        run: wails generate module

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Wails application
        id: build
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION="${{ github.ref_name }}"
          COMMIT_MSG="${{ steps.get_commit_message.outputs.commit_message }}"
          STATEMENT="${{ env.OFFICIAL_STATEMENT }}"
          BUILD_KEY="${{ env.BUILD_KEY }}"
          
          wails build \
            -platform "${{ matrix.build.platform }}" \
            -skipbindings \
            -skipembedcreate \
            -product-version "${VERSION}" \
            -file-description "${COMMIT_MSG}" \
            -copyright "${STATEMENT}" \
            -company-name "${BUILD_KEY}" \
            -comments "Blades Stock - ${{ steps.channel.outputs.channel_label }}"

      - name: Package Windows (zip + NSIS)
        if: runner.os == 'Windows'
        run: |
          # Zip the build output
          $buildDir = "build/bin"
          $zipName = "${{ matrix.build.name }}.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "$zipName" -Force
          echo "artifact_name=$zipName" >> $GITHUB_OUTPUT
          echo "artifact_path=$zipName" >> $GITHUB_OUTPUT

          # NSIS installer (if NSIS is available)
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            $nsisScript = "frontend/nsis/installer.nsi"
            if (Test-Path $nsisScript) {
              makensis $nsisScript
              $exeName = "${{ matrix.build.name }}.exe"
              if (Test-Path "$exeName") {
                echo "nsis_artifact_name=$exeName" >> $GITHUB_OUTPUT
                echo "nsis_artifact_path=$exeName" >> $GITHUB_OUTPUT
              }
            }
          }
        shell: powershell

      - name: Package macOS (zip)
        if: runner.os == 'macOS'
        run: |
          buildDir="build/bin"
          zipName="${{ matrix.build.name }}.zip"
          cd "$buildDir"
          zip -r "../$zipName" .
          cd ../..
          echo "artifact_name=$zipName" >> $GITHUB_OUTPUT
          echo "artifact_path=build/$zipName" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: |
            ${{ steps.build.outputs.artifact_path }}
            ${{ steps.build.outputs.nsis_artifact_path }}
          if-no-files-found: warn

      - name: Update release for channel
        if: steps.channel.outputs.channel != 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = '${{ github.ref_name }}';
            const channel = '${{ steps.channel.outputs.channel }}';
            const channelLabel = '${{ steps.channel.outputs.channel_label }}';
            const prerelease = '${{ steps.channel.outputs.prerelease }}' === 'true';

            const { data: releases } = await github.rest.repos.listReleases({ owner, repo });
            const release = releases.find(r => r.tag_name === tag);

            if (release) {
              const updateParams = {
                owner,
                repo,
                release_id: release.id,
                prerelease: prerelease,
                make_latest: 'false'
              };

              let channelNotice = '';
              if (channel === 'dev') {
                channelNotice = '\n\n---\n> ⚠️ **' + channelLabel + '** - 此版本为开发版，可能存在不稳定功能，仅供测试使用。';
              } else if (channel === 'pre') {
                channelNotice = '\n\n---\n> 🔄 **' + channelLabel + '** - 此版本为预发布版，欢迎体验新功能并反馈问题。';
              }
              if (channelNotice) {
                updateParams.body = (release.body || '') + channelNotice;
              }

              await github.rest.repos.updateRelease(updateParams);
              core.info(`Updated release ${tag}: prerelease=${prerelease}, channel=${channel}`);
            } else {
              core.warning(`Release not found for tag ${tag}`);
            }