name: Deploy ai-assistant-web to VPS

on:
  push:
    branches: [dev]
    paths:
      - 'ai-assistant-web/**'
      - 'backend/data/**'
      - 'backend/db/**'
      - 'backend/logger/**'
      - 'backend/models/**'
      - 'backend/agent/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  BINARY_NAME: 'ai-assistant-web-server'
  DEPLOY_PATH: '/opt/ai-assistant-web'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ai-assistant-web/frontend/package-lock.json

      - name: Build frontend
        working-directory: ai-assistant-web/frontend
        run: |
          npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build server binary
        run: |
          go build -o ${{ env.BINARY_NAME }} -ldflags="-s -w" ./ai-assistant-web/cmd/ai-assistant-web/

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ${{ env.BINARY_NAME }}
          target: ${{ env.DEPLOY_PATH }}

      - name: Restart service on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            chmod +x ${{ env.DEPLOY_PATH }}/${{ env.BINARY_NAME }}
            mv ${{ env.DEPLOY_PATH }}/${{ env.BINARY_NAME }} ${{ env.DEPLOY_PATH }}/${{ env.BINARY_NAME }}-new
            # 平滑重启
            if systemctl is-active --quiet ai-assistant-web; then
              sudo systemctl stop ai-assistant-web
            fi
            cp ${{ env.DEPLOY_PATH }}/${{ env.BINARY_NAME }}-new ${{ env.DEPLOY_PATH }}/${{ env.BINARY_NAME }}
            rm -f ${{ env.DEPLOY_PATH }}/${{ env.BINARY_NAME }}-new
            sudo systemctl start ai-assistant-web
            sleep 2
            sudo systemctl status ai-assistant-web --no-pager

      - name: Health check
        run: |
          sleep 3
          curl -f http://${{ secrets.VPS_HOST }}:${{ secrets.VPS_PORT || 18081 }}/api/health || echo "Health check failed (may need port config)"
