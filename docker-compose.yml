# ==============================================================================
# Blades Stock — 边缘计算私有量化投研工作站 (Edge-Native Private Quant Workstation v3.0.0)
# 架构说明 (Single-Node Architecture):
#   - 定位：面向独立交易员与买方投研团队的单节点私有化量化中台，非多租户弹性横向扩容集群
#   - 底层存储：纯嵌入式 SQLite WAL 权威库 (_txlock=immediate, busy_timeout=30s)
#   - 架构优势：免运维、单二进制全静态编译、亚毫秒级行情查询无网络序列化损耗，内存占用 <80MB
#   - 适配规格：甲骨文云 / Instabox 云沙箱 / Ubuntu 24.04 VPS (1~8核 / 2~16G 内存)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 核心量化投研中台 (Web UI + Go 核心引擎)
  # ----------------------------------------------------------------------------
  blades-stock:
    build:
      context: .
      dockerfile: Dockerfile
    image: blades-stock:latest
    container_name: blades-stock
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - TZ=Asia/Shanghai
      - PORT=${PORT:-8000}
      # 公网访问口令：必须在 .env 或环境中设定 BLADES_AUTH_TOKEN（无默认值）。
      # 未设定时服务端首次启动会随机生成一个口令并固化到 data/auth.token，
      # 同时在启动日志里打印一次（docker compose logs blades-stock）。
      - BLADES_AUTH_TOKEN=${BLADES_AUTH_TOKEN:-}
      # 默认 SearXNG 聚合搜索端点
      - SEARXNG_URL=${SEARXNG_URL:-https://search.woha.men}
      # 可选外部 API Key 注入
      - TICKFLOW_API_KEY=${TICKFLOW_API_KEY:-}
      # Go 内存软限制 (防止容器内存突增 OOM)
      - GOMEMLIMIT=${GOMEMLIMIT:-}
    volumes:
      # 持久化挂载本地 SQLite 权威库、自选配置与历史数据
      - ./data:/app/data
      # 挂载运行日志目录
      - ./logs:/app/logs
      # 发布韧性 (P0)：上一版本前端产物只读挂载。
      # 目的：部署新版本会整体替换 /app/frontend/dist，使所有旧哈希 chunk 立即消失。
      # 此时「已打开旧页面的在线用户」点击懒加载路由会请求到 404 → 整页失去响应
      # （该失败发生在 import 阶段，早于 ErrorBoundary 挂载，前端无法自行捕获）。
      # 挂载上一版产物后，Go 静态处理器会把旧 chunk 回退为 200，前端 staleChunkGuard
      # 随后静默刷新到最新版本，用户全程无感。
      # 快照由 scripts/deploy-vps.sh 在每次部署前通过 docker cp 自动生成。
      - ./frontend/dist-previous:/app/frontend/dist-previous:ro
    deploy:
      resources:
        limits:
          # CPU 配额自适应：4核(如 Instabox)分配 3.8 核；2核(如甲骨文)可在 .env 配置为 1.8 核
          cpus: '${BLADES_CPU_LIMIT:-3.8}'
          # 内存限制自适应：8G(Instabox)与 12G(甲骨文)默认分配充裕 6G 内存给量化计算与缓存
          memory: '${BLADES_MEM_LIMIT:-6G}'
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # [进阶可选] 私有独享 SearXNG 搜索引擎节点
  # 若需 100% 独立于外部公共搜索端点，取消下列注释即可一键启动独享搜索集群
  # ----------------------------------------------------------------------------
  # searxng:
  #   image: searxng/searxng:latest
  #   container_name: blades-searxng
  #   restart: unless-stopped
  #   ports:
  #     - "8888:8080"
  #   environment:
  #     - SEARXNG_BASE_URL=http://localhost:8888/
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512M
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
