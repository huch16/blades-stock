version: '3.8'

# ==============================================================================
# Blades Stock — Cloud-Native Web/SaaS 生产环境编排 (v1.8.0)
# 针对多规格 VPS 异构环境自适应调优：
#   - 甲骨文云 (Oracle Cloud): 2核 CPU / 12G 内存
#   - Instabox 云沙箱: 4核 CPU / 8G 内存
#   - 以及通用 Ubuntu 24.04 VPS (1~8核 / 2~16G 内存)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 核心量化投研中台 (Web UI + Go 核心引擎)
  # ----------------------------------------------------------------------------
  blades-stock:
    build:
      context: .
      dockerfile: Dockerfile
    image: blades-stock:latest
    container_name: blades-stock
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - TZ=Asia/Shanghai
      - PORT=${PORT:-8000}
      # 公网访问安全口令（默认统一为 2266762，亦可在 .env 中自定义覆盖）
      - BLADES_AUTH_TOKEN=${BLADES_AUTH_TOKEN:-2266762}
      # 默认 SearXNG 聚合搜索端点
      - SEARXNG_URL=${SEARXNG_URL:-https://search.woha.men}
      # 可选外部 API Key 注入
      - TICKFLOW_API_KEY=${TICKFLOW_API_KEY:-}
      # Go 内存软限制 (防止容器内存突增 OOM)
      - GOMEMLIMIT=${GOMEMLIMIT:-}
    volumes:
      # 持久化挂载本地 SQLite 权威库、自选配置与历史数据
      - ./data:/app/data
      # 挂载运行日志目录
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          # CPU 配额自适应：4核(如 Instabox)分配 3.8 核；2核(如甲骨文)可在 .env 配置为 1.8 核
          cpus: '${BLADES_CPU_LIMIT:-3.8}'
          # 内存限制自适应：8G(Instabox)与 12G(甲骨文)默认分配充裕 6G 内存给量化计算与缓存
          memory: '${BLADES_MEM_LIMIT:-6G}'
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # [进阶可选] 私有独享 SearXNG 搜索引擎节点
  # 若需 100% 独立于外部公共搜索端点，取消下列注释即可一键启动独享搜索集群
  # ----------------------------------------------------------------------------
  # searxng:
  #   image: searxng/searxng:latest
  #   container_name: blades-searxng
  #   restart: unless-stopped
  #   ports:
  #     - "8888:8080"
  #   environment:
  #     - SEARXNG_BASE_URL=http://localhost:8888/
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512M
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
