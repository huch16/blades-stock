version: '3.8'

services:
  blades-stock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blades-stock
    restart: unless-stopped
    environment:
      - BLADES_STOCK_LOG_CONSOLE=1
      - METRICS_EXPORTER=prometheus
      - METRICS_PROMETHEUS_ADDR=:9464
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # If you need to persist SQLite database
    ports:
      - "9464:9464"  # Prometheus metrics
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9464/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Prometheus for metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - blades-stock

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  grafana-data:
